name: Release

# Push a tag such as v1.1 to build a signed APK and publish it as a GitHub Release.
# The app checks the latest release for updates.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build signed APK
        env:
          SHAH_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SHAH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SHAH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SHAH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # versionCode is derived from the tag (1.2.3 -> 10203) so it stays monotonic in any repository.
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$(( MAJOR * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          ./gradlew :app:assembleRelease -PversionName="$VERSION" -PversionCode="$CODE"
          cp app/build/outputs/apk/release/app-release.apk "Shah-$VERSION.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Shah-${GITHUB_REF_NAME#v}.apk" --title "$GITHUB_REF_NAME" --generate-notes
